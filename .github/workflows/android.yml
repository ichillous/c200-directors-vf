name: Build Android app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Releases queue up one at a time; a pull request only cancels its own older runs.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm test
      - name: Build the web app for Android
        run: npm run build
        env:
          NATIVE: '1'
          GITHUB_SHA: ${{ github.sha }}
      - run: npx cap sync android
      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleRelease -PbuildNumber=${{ github.run_number }} --no-daemon
      # A pull request only checks that the APK builds; it publishes nothing.
      - name: Keep the APK from this pull request
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: C200-Viewfinder-pr-apk
          path: android/app/build/outputs/apk/release/app-release.apk
      - name: Publish it on the Releases page
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 1.0.${{ github.run_number }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk C200-Viewfinder.apk
          gh release create "v$VERSION" C200-Viewfinder.apk \
            --title "C200 Viewfinder $VERSION" \
            --notes "Download C200-Viewfinder.apk on the phone and open it to install. It installs over the previous version and keeps your frames." \
            --latest
